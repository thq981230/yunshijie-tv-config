name: Source health and publish

run-name: Source health refresh ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_id || github.run_id }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_id:
        description: Refresh request correlation id
        required: false
        type: string
        default: manual
      refresh_scope:
        description: Channels to probe
        required: false
        type: choice
        options:
          - ALL
          - CHANNEL
          - CATEGORY
        default: ALL
      channel_id:
        description: Channel id when refresh_scope is CHANNEL
        required: false
        type: string
      category_id:
        description: Category id when refresh_scope is CATEGORY
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: source-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source catalog and run unit tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_config.py --inputs-only
      - name: Stage the stable channel catalog
        run: python scripts/publish_catalog.py
      - name: Probe manifests and first media segments
        env:
          REFRESH_SCOPE: ${{ inputs.refresh_scope || 'ALL' }}
          REFRESH_CHANNEL_ID: ${{ inputs.channel_id || '' }}
          REFRESH_CATEGORY_ID: ${{ inputs.category_id || '' }}
        run: |
          python scripts/check_sources.py --scope "$REFRESH_SCOPE" \
            --channel-id "$REFRESH_CHANNEL_ID" --category-id "$REFRESH_CATEGORY_ID"
      - name: Promote healthy sources with mass-failure protection
        id: promote
        continue-on-error: true
        run: python scripts/promote_sources.py
      - name: Build version manifest and validate final files
        run: |
          python scripts/build_manifest.py
          python scripts/validate_config.py
      - name: Commit health state and published configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/latest.json public releases
          if git diff --cached --quiet; then
            echo "No config changes to publish."
          else
            git commit -m "Update source health and published config"
            git push
          fi
      - name: Report a refused source promotion
        if: steps.promote.outcome == 'failure'
        run: |
          echo "::error::Source promotion was refused. Health counters were saved; the previous public sources file was preserved."
          exit 1
